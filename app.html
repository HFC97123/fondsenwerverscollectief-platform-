<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Het Fondsenwervers Collectief · Subsidie Kompas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&amp;family=Mulish:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Letterlijk overgenomen uit het goedgekeurde ontwerp. Niet aanpassen. -->
    <style>
      body { margin: 0; background: #F7F9F8; }
      a { color: #4E9A6C; text-decoration: none; }
      a:hover { color: #2C4A5E; }
      @keyframes fw-pulse {
        0%, 100% { box-shadow: 0 6px 20px rgba(44,74,94,0.3), 0 0 0 0 rgba(78,154,108,0.4); }
        50% { box-shadow: 0 6px 20px rgba(44,74,94,0.3), 0 0 0 10px rgba(78,154,108,0); }
      }
      @keyframes fw-float-a { 0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); } 50% { transform: translateY(-34px) translateX(9px) rotate(9deg); } }
      @keyframes fw-float-b { 0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); } 50% { transform: translateY(30px) translateX(-11px) rotate(-10deg); } }
      @keyframes fw-float-c { 0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); } 50% { transform: translateY(-26px) translateX(-9px) rotate(-8deg); } }
      @keyframes fw-float-d { 0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); } 50% { transform: translateY(28px) translateX(11px) rotate(10deg); } }
      @keyframes sk-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes sk-spin-rev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes sk-euro-a { 0% { transform: translateY(20px) rotate(-8deg); opacity: 0; } 14% { opacity: 0.4; } 86% { opacity: 0.4; } 100% { transform: translateY(-120px) rotate(8deg); opacity: 0; } }
      @keyframes sk-euro-b { 0% { transform: translateY(30px) rotate(6deg); opacity: 0; } 16% { opacity: 0.4; } 84% { opacity: 0.4; } 100% { transform: translateY(-140px) rotate(-6deg); opacity: 0; } }
      @keyframes sk-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
      @keyframes sk-needle { 0% { transform: rotate(0deg); } 22% { transform: rotate(212deg); } 40% { transform: rotate(188deg); } 58% { transform: rotate(340deg); } 78% { transform: rotate(318deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
